<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ป้ายระบุและควบคุมการใช้จัมโบ้</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper:#F1ECDF;
    --paper-2:#E7DFC7;
    --card:#FAF7EE;
    --ink:#23291F;
    --ink-soft:#5B5B4C;
    --green:#2F5233;
    --green-deep:#213B26;
    --green-light:#4C7A52;
    --amber:#B8873A;
    --red:#A8402F;
    --line:#C9C0A0;
    --line-soft:#DAD2B6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans Thai',sans-serif;
    min-height:100vh;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px);
    background-size: 100% 42px;
    background-attachment:local;
  }
  h1,h2,h3{font-family:'Noto Serif Thai',serif; margin:0;}
  button{font-family:inherit;}
  .app{max-width:920px;margin:0 auto;padding:0 0 60px;}

  /* Header */
  .topbar{
    background:var(--green-deep);
    color:var(--paper);
    padding:22px 20px 18px;
    border-bottom:4px solid var(--green);
    position:relative;
  }
  .topbar .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--green-light), var(--green) 70%);
    border:2px solid var(--paper);
    flex-shrink:0;
  }
  .topbar h1{font-size:19px;font-weight:600;letter-spacing:.2px;}
  .topbar .sub{font-size:12.5px;color:#CFE0CE;margin-top:3px;font-family:'Noto Sans Thai';}

  /* Tabs styled like ledger index tabs */
  .tabs{
    display:flex;gap:4px;
    padding:0 16px;background:var(--green-deep);
    overflow-x:auto;
  }
  .tab{
    background:var(--paper-2);
    color:var(--ink-soft);
    border:none;
    padding:10px 16px 9px;
    font-size:13.5px;
    font-weight:600;
    font-family:'Noto Sans Thai';
    border-radius:8px 8px 0 0;
    cursor:pointer;
    white-space:nowrap;
    transform:translateY(4px);
    transition:transform .12s, background .12s, color .12s;
  }
  .tab.active{
    background:var(--card);
    color:var(--green-deep);
    transform:translateY(0);
  }

  .panel{padding:22px 18px 10px;}
  .section-title{font-size:15px;color:var(--ink-soft);margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  .section-title strong{color:var(--ink);font-family:'Noto Serif Thai';font-size:19px;font-weight:600;}

  /* Jumbo card grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
  .tag-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    position:relative;
    padding:16px 14px 14px;
    cursor:pointer;
    transition:box-shadow .15s, transform .15s;
    box-shadow:0 1px 0 var(--line-soft);
  }
  .tag-card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(35,41,31,.12);}
  .tag-card .holes{position:absolute;top:8px;right:10px;display:flex;gap:5px;}
  .tag-card .hole{width:9px;height:9px;border-radius:50%;background:var(--paper);border:1px solid var(--line);}
  .tag-card .jno{font-family:'Noto Serif Thai';font-size:13px;color:var(--green);font-weight:600;letter-spacing:.5px;}
  .tag-card .code{font-size:22px;font-weight:700;font-family:'Noto Serif Thai';margin-top:2px;color:var(--ink);}
  .tag-card .name{font-size:13px;color:var(--ink-soft);margin-top:2px;min-height:34px;line-height:1.35;}
  .tag-card .qr-thumb{width:56px;height:56px;margin-top:10px;border:1px solid var(--line-soft);background:#fff;padding:4px;}
  .tag-card .qr-thumb img{width:100%;height:100%;display:block;}
  .meter-row{margin-top:10px;}
  .meter-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
  .meter{height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden;}
  .meter > span{display:block;height:100%;background:var(--green-light);}
  .meter.warn > span{background:var(--amber);}
  .meter.full > span{background:var(--red);}
  .status-pill{display:inline-block;margin-top:9px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px;}
  .status-ok{background:#E4EEE0;color:var(--green-deep);}
  .status-warn{background:#F3E6CE;color:#7A5A1E;}
  .status-full{background:#F3DAD5;color:var(--red);}

  /* Detail view */
  .backlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--green-deep);background:none;border:none;cursor:pointer;padding:0;margin-bottom:14px;font-weight:600;}
  .detail-head{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);padding:18px;border-radius:4px;}
  .detail-qr{background:#fff;border:1px solid var(--line-soft);padding:8px;flex-shrink:0;}
  .detail-qr img{display:block;width:120px;height:120px;}
  .detail-info .jno{font-family:'Noto Serif Thai';color:var(--green);font-size:14px;font-weight:600;}
  .detail-info .code{font-size:28px;font-weight:700;font-family:'Noto Serif Thai';margin:2px 0 3px;}
  .detail-info .name{color:var(--ink-soft);font-size:14.5px;}
  .detail-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .btn{
    border:1px solid var(--green-deep);
    background:var(--green-deep);
    color:var(--paper);
    padding:8px 14px;
    border-radius:4px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:'Noto Sans Thai';
  }
  .btn.ghost{background:transparent;color:var(--green-deep);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  table.ledger{width:100%;border-collapse:collapse;margin-top:18px;font-size:12.8px;background:var(--card);}
  table.ledger th,table.ledger td{border:1px solid var(--line);padding:6px 6px;text-align:center;}
  table.ledger th{background:var(--paper-2);color:var(--ink-soft);font-weight:600;font-size:11.8px;}
  table.ledger td.rownum{color:var(--ink-soft);width:26px;}
  table.ledger td.note{text-align:left;font-size:11.8px;color:var(--ink-soft);}
  .tick{color:var(--green);font-weight:700;}
  .dash{color:var(--line);}

  .form-box{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;margin-top:18px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
  .form-grid .full{grid-column:1/-1;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  input[type=text],input[type=date]{
    width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:3px;
    background:#fff;font-family:'Noto Sans Thai';font-size:13.5px;color:var(--ink);
  }
  .check-row{display:flex;align-items:center;gap:8px;padding:8px 0;}
  .check-row input{width:16px;height:16px;}
  .limit-note{font-size:12.5px;color:var(--red);font-weight:600;margin-top:10px;}

  /* Scan */
  .scan-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .viewfinder{
    width:260px;height:260px;position:relative;
    background:#111;border-radius:4px;overflow:hidden;
    border:2px solid var(--green-deep);
  }
  .viewfinder video{width:100%;height:100%;object-fit:cover;}
  .corner{position:absolute;width:22px;height:22px;border-color:var(--amber);}
  .corner.tl{top:8px;left:8px;border-top:3px solid var(--amber);border-left:3px solid var(--amber);}
  .corner.tr{top:8px;right:8px;border-top:3px solid var(--amber);border-right:3px solid var(--amber);}
  .corner.bl{bottom:8px;left:8px;border-bottom:3px solid var(--amber);border-left:3px solid var(--amber);}
  .corner.br{bottom:8px;right:8px;border-bottom:3px solid var(--amber);border-right:3px solid var(--amber);}
  .scan-msg{font-size:13px;color:var(--ink-soft);text-align:center;max-width:320px;}
  .manual-scan{background:var(--card);border:1px solid var(--line);padding:14px;border-radius:4px;width:100%;max-width:340px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--green-deep);color:var(--paper);padding:10px 18px;border-radius:5px;
    font-size:13.5px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .export-box{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px;}
  .export-box p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;}
  .summary-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.8px;}
  .summary-table th,.summary-table td{border:1px solid var(--line);padding:6px 8px;text-align:left;}
  .summary-table th{background:var(--paper-2);}

  .conn-ok{color:#B9D6B6 !important;}
  .conn-bad{color:#F0BDB2 !important;}

  .setup-screen{max-width:640px;margin:30px auto;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px;}
  .setup-screen h2{font-size:18px;margin-bottom:10px;}
  .setup-screen ol{padding-left:20px;font-size:13.5px;line-height:1.9;color:var(--ink);}
  .setup-screen code{background:var(--paper-2);padding:1px 6px;border-radius:3px;font-size:12.5px;}
  .setup-screen .warn-box{background:#F3DAD5;color:var(--red);padding:10px 12px;border-radius:4px;font-size:12.5px;margin-top:14px;}

  /* user gate (sign-in) */
  .user-gate{max-width:400px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:28px;text-align:center;}
  .user-gate h2{font-size:18px;margin-bottom:8px;}
  .user-gate p{font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;}
  .user-gate input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;font-family:'Noto Sans Thai';font-size:14px;margin-bottom:12px;}
  #gsiButtonHolder{display:flex;justify-content:center;margin-bottom:6px;}
  .user-badge{display:flex;align-items:center;gap:8px;font-size:12px;color:#CFE0CE;margin-top:4px;}
  .user-badge .switch-link{color:#CFE0CE;text-decoration:underline;cursor:pointer;background:none;border:none;font-size:12px;padding:0;font-family:'Noto Sans Thai';}

  /* quick action screen */
  .quick-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px;text-align:center;max-width:460px;margin:0 auto;}
  .quick-card .jtitle{font-family:'Noto Serif Thai';font-size:15px;color:var(--green);font-weight:600;}
  .quick-card .jtype{font-size:26px;font-weight:700;font-family:'Noto Serif Thai';margin:2px 0 14px;}
  .quick-status{font-size:15px;font-weight:600;padding:12px;border-radius:5px;margin-bottom:18px;}
  .quick-status.ok{background:#E4EEE0;color:var(--green-deep);}
  .quick-status.warn{background:#F3E6CE;color:#7A5A1E;}
  .quick-status.bad{background:#F3DAD5;color:var(--red);}
  .quick-actions{display:flex;gap:12px;flex-direction:column;}
  .quick-btn{
    padding:22px 16px;border-radius:8px;font-size:20px;font-weight:700;font-family:'Noto Sans Thai';
    border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .quick-btn.use{background:var(--green-deep);color:var(--paper);}
  .quick-btn.damaged{background:var(--red);color:#fff;}
  .quick-btn:disabled{opacity:.4;cursor:not-allowed;}
  .toggle-details{margin-top:18px;background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;cursor:pointer;font-family:'Noto Sans Thai';}

  /* print */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;background:#fff !important;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;top:0;left:0;width:100%;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <h1>ป้ายระบุและควบคุมการใช้จัมโบ้</h1>
        <div class="sub">ระบบติดตามการใช้งานจัมโบ้ด้วย QR Code &nbsp;·&nbsp; ข้าวไทยไม่เกิน 20 ครั้ง / ข้าวญี่ปุ่นไม่เกิน 5 ครั้งต่อจัมโบ้</div>
        <div class="sub" id="connStatus" style="margin-top:4px;">กำลังเชื่อมต่อฐานข้อมูล...</div>
        <div class="user-badge" id="userBadge" style="display:none;"></div>
      </div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab" data-tab="list">รายการจัมโบ้</button>
    <button class="tab" data-tab="scan">สแกน QR</button>
    <button class="tab" data-tab="export">ส่งออกข้อมูล</button>
  </div>

  <div class="panel" id="panel"></div>
</div>

<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* ==================================================================
   ตั้งค่าการเชื่อมต่อ Google Sheet (แก้ 2 ค่าด้านล่างนี้)
   วิธีขอค่านี้: ดูขั้นตอนในคู่มือการใช้งานที่แนบมาพร้อมไฟล์นี้
   ================================================================== */
const APPS_SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE";
const APPS_SCRIPT_TOKEN = "PASTE_YOUR_SECRET_TOKEN_HERE";

/* ==================================================================
   ตั้งค่า Google Sign-In (ไม่บังคับ) — ใส่ Client ID เพื่อให้ผู้ใช้ล็อกอินด้วย
   บัญชี Google แล้วระบบดึงชื่อมาใช้เป็น "ผู้บันทึก" ให้อัตโนมัติ ไม่ต้องพิมพ์เอง
   ถ้าไม่ตั้งค่า จะถามให้พิมพ์ชื่อครั้งเดียวแล้วจำไว้ในเครื่องแทน
   ================================================================== */
const GOOGLE_CLIENT_ID = "PASTE_YOUR_GOOGLE_CLIENT_ID_HERE";
const GOOGLE_CONFIGURED = GOOGLE_CLIENT_ID.indexOf('PASTE_') !== 0;

const NOT_CONFIGURED = APPS_SCRIPT_URL.indexOf('PASTE_') === 0 || APPS_SCRIPT_TOKEN.indexOf('PASTE_') === 0;
const POLL_MS = 7000; // ความถี่ในการดึงข้อมูลใหม่จาก Google Sheet (มิลลิวินาที)

let dbReady = false;
let currentUser = null; // { name, email }

function loadUser(){
  try{
    const raw = localStorage.getItem('jumbo_user');
    currentUser = raw ? JSON.parse(raw) : null;
  }catch(e){ currentUser = null; }
}
function saveUser(u){
  currentUser = u;
  try{ localStorage.setItem('jumbo_user', JSON.stringify(u)); }catch(e){}
  renderUserBadge();
}
function clearUser(){
  currentUser = null;
  try{ localStorage.removeItem('jumbo_user'); }catch(e){}
  renderUserBadge();
  renderUserGate();
}
function renderUserBadge(){
  const el = document.getElementById('userBadge');
  if(!el) return;
  if(!currentUser){ el.style.display='none'; return; }
  el.style.display='flex';
  el.innerHTML = `<span>ผู้ใช้งาน: ${currentUser.name}</span><button class="switch-link" id="switchUserBtn">เปลี่ยนผู้ใช้</button>`;
  document.getElementById('switchUserBtn').addEventListener('click', clearUser);
}

function decodeJwt_(token){
  const payload = token.split('.')[1];
  const json = decodeURIComponent(atob(payload.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>
    '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2)
  ).join(''));
  return JSON.parse(json);
}

function renderUserGate(){
  document.querySelectorAll('.tab').forEach(b=>b.style.display='none');
  const panel = document.getElementById('panel');
  if(GOOGLE_CONFIGURED){
    panel.innerHTML = `
      <div class="user-gate">
        <h2>เข้าสู่ระบบ</h2>
        <p>ลงชื่อเข้าใช้ด้วยบัญชี Google เพื่อใช้ชื่อของคุณเป็นผู้บันทึกอัตโนมัติ ไม่ต้องพิมพ์ชื่อทุกครั้ง</p>
        <div id="gsiButtonHolder">กำลังโหลด...</div>
      </div>`;
    let tries = 0;
    const tryInit = ()=>{
      if(window.google && google.accounts && google.accounts.id){
        document.getElementById('gsiButtonHolder').innerHTML = '';
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: (resp)=>{
            try{
              const profile = decodeJwt_(resp.credential);
              saveUser({ name: profile.name || profile.email, email: profile.email });
              document.querySelectorAll('.tab').forEach(b=>b.style.display='');
              goTo('list');
            }catch(e){ toast('เข้าสู่ระบบไม่สำเร็จ: ' + e.message); }
          }
        });
        google.accounts.id.renderButton(document.getElementById('gsiButtonHolder'), { theme:'filled_black', size:'large', shape:'pill', text:'signin_with' });
      } else if(tries++ < 40){
        setTimeout(tryInit, 150);
      } else {
        document.getElementById('gsiButtonHolder').innerHTML = '<div style="color:var(--red);font-size:12.5px;">โหลด Google Sign-In ไม่สำเร็จ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วรีเฟรชหน้าใหม่</div>';
      }
    };
    tryInit();
  } else {
    panel.innerHTML = `
      <div class="user-gate">
        <h2>ก่อนเริ่มใช้งาน</h2>
        <p>พิมพ์ชื่อของคุณ ระบบจะจำไว้ในเครื่องนี้ ไม่ต้องพิมพ์ซ้ำทุกครั้งที่บันทึกการใช้งาน</p>
        <input type="text" id="manualNameInput" placeholder="ชื่อ-นามสกุลของคุณ">
        <button class="btn" id="manualNameBtn" style="width:100%;">เริ่มใช้งาน</button>
      </div>`;
    document.getElementById('manualNameBtn').addEventListener('click', ()=>{
      const name = document.getElementById('manualNameInput').value.trim();
      if(!name){ toast('กรุณากรอกชื่อก่อน'); return; }
      saveUser({ name, email: '' });
      document.querySelectorAll('.tab').forEach(b=>b.style.display='');
      goTo('list');
    });
  }
}

async function initApp(){
  if(NOT_CONFIGURED){
    showSetupScreen();
    return;
  }
  setConnStatus('กำลังเชื่อมต่อ Google Sheet...', true);
  try{
    await apiGet('list');
    dbReady = true;
    setConnStatus('เชื่อมต่อ Google Sheet สำเร็จ · อัปเดตข้อมูลอัตโนมัติทุก ' + Math.round(POLL_MS/1000) + ' วินาที', true);
    loadUser();
    if(currentUser){ renderUserBadge(); goTo('list'); }
    else{ renderUserGate(); }
  }catch(err){
    console.error(err);
    setConnStatus('เชื่อมต่อ Google Sheet ไม่สำเร็จ: ' + (err && err.message ? err.message : err), false);
    showSetupScreen();
  }
}

function setConnStatus(text, ok){
  const el = document.getElementById('connStatus');
  if(!el) return;
  el.textContent = text;
  el.classList.remove('conn-ok','conn-bad');
  el.classList.add(ok ? 'conn-ok' : 'conn-bad');
}

function showSetupScreen(){
  setConnStatus('ยังไม่ได้เชื่อมต่อ Google Sheet', false);
  document.querySelectorAll('.tab').forEach(b=>b.style.display='none');
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <div class="setup-screen">
      <h2>ยังไม่ได้เชื่อมต่อฐานข้อมูล (Google Sheet)</h2>

        <li>กด Deploy → New deployment → ประเภท Web app → Execute as: Me → Who has access: Anyone → Deploy แล้วคัดลอก Web app URL</li>
        <li>นำ URL และรหัสลับมาใส่ในไฟล์ HTML นี้ที่ตัวแปร <code>APPS_SCRIPT_URL</code> และ <code>APPS_SCRIPT_TOKEN</code> ที่ต้นไฟล์สคริปต์ แล้วบันทึกไฟล์</li>

    </div>`;
}

/* ---------------- Data model ---------------- */
const TYPE_OPTIONS = ['ข้าวไทย', 'ข้าวญี่ปุ่น'];
const TYPE_ABBR = { 'ข้าวไทย': 'TH', 'ข้าวญี่ปุ่น': 'JP' };
const MAX_USES = 20; // ค่าเริ่มต้น (ใช้กับชนิดข้าวที่ไม่ได้กำหนดไว้เฉพาะ)
const MAX_USES_BY_TYPE = { 'ข้าวไทย': 20, 'ข้าวญี่ปุ่น': 5 };
function getMaxUses(type){ return MAX_USES_BY_TYPE[type] || MAX_USES; }

/* ---------------- Apps Script API helpers ---------------- */
async function apiGet(action, params){
  params = params || {};
  const url = new URL(APPS_SCRIPT_URL);
  url.searchParams.set('token', APPS_SCRIPT_TOKEN);
  url.searchParams.set('action', action);
  url.searchParams.set('_', Date.now() + '-' + Math.random().toString(36).slice(2)); // กันแคช: ทำให้ URL ไม่ซ้ำกันทุกครั้ง
  Object.keys(params).forEach(k=> url.searchParams.set(k, params[k]));
  const res = await fetch(url.toString(), { cache: 'no-store' });
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}
async function apiPost(action, payload){
  payload = payload || {};
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    cache: 'no-store',
    body: JSON.stringify(Object.assign({ action, token: APPS_SCRIPT_TOKEN }, payload))
  });
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}

async function fetchAll(){
  return await apiGet('list'); // { jumbos:[{id,jno,type}], usage:{ id:[entries] } }
}
async function fetchJumbosOnce(){
  const all = await fetchAll();
  return all.jumbos;
}
async function addJumbo(type){
  return await apiPost('addJumbo', { type }); // { id, jno, type }
}
async function deleteJumbo(id){
  return await apiPost('deleteJumbo', { id });
}
async function loadLog(jumboId){
  const all = await fetchAll();
  return all.usage[jumboId] || [];
}
async function addLogEntry(jumboId, entry, maxUses){
  const res = await apiPost('addEntry', { jumboId, entry, maxUses });
  return !!(res && res.ok);
}
async function markDamaged(jumboId, recorder){
  return await apiPost('markDamaged', { jumboId, recorder });
}

/* ---------------- Toast ---------------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

function clearListeners(){
  activeUnsubs.forEach(fn=>{ try{ fn(); }catch(e){} });
  activeUnsubs = [];
}

document.getElementById('tabs').addEventListener('click', e=>{

async function goTo(tab){
  if(!dbReady) return;
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));

}

/* ---------------- QR helpers ---------------- */
function makeQrDataUrl(text, size){
  return new Promise(resolve=>{
    const holder = document.createElement('div');
    holder.style.display='none';
    document.body.appendChild(holder);
    new QRCode(holder, {text, width:size, height:size, correctLevel: QRCode.CorrectLevel.M});
    setTimeout(()=>{
      const img = holder.querySelector('img');
      const canvas = holder.querySelector('canvas');
      let url = '';
      if(canvas) url = canvas.toDataURL('image/png');
      else if(img) url = img.src;
      document.body.removeChild(holder);
      resolve(url);
    }, 60);
  });
}

  </div>
  <div style="margin-bottom:16px;">
    <button class="btn small" id="addJumboBtn">+ เพิ่มจัมโบ้ใหม่</button>
  </div>

    </div>
  </div>
  <div class="grid" id="grid">กำลังโหลด...</div>`;

  let typeFilter = 'all';
  document.getElementById('filterRow').addEventListener('click', e=>{
    const btn = e.target.closest('.filter-btn');
    if(!btn) return;
    typeFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b=>{
      const isActive = b===btn;

  document.getElementById('addJumboBtn').addEventListener('click', ()=>{
    document.getElementById('addForm').style.display='block';
  });
  document.getElementById('cancelAdd').addEventListener('click', ()=>{
    document.getElementById('addForm').style.display='none';
  });
  document.getElementById('confirmAdd').addEventListener('click', async ()=>{
    const type = document.getElementById('newType').value;
    try{
      const created = await addJumbo(type);
      toast(`เพิ่มจัมโบ้ No.${created.jno} (${type}) เรียบร้อย`);
      document.getElementById('addForm').style.display='none';
    }catch(err){ toast('เพิ่มจัมโบ้ไม่สำเร็จ: ' + err.message); }
  });

  let latestJumbos = [];
  let latestUsage = {};
  let renderSeq = 0; // ป้องกันการวาดซ้ำเมื่อมีข้อมูลใหม่เข้ามาระหว่างกำลังวาดรอบเก่ายังไม่เสร็จ

  const redraw = async ()=>{
    const mySeq = ++renderSeq;
    const jumbos = latestJumbos;
    const usage = latestUsage;
    const visibleJumbos = typeFilter==='all' ? jumbos : jumbos.filter(j=>j.type===typeFilter);

    jumbosCache = jumbos;
    document.getElementById('jCount').textContent = `${visibleJumbos.length} รายการ${typeFilter!=='all' ? ` (กรอง: ${typeFilter})` : ''}`;
    const grid = document.getElementById('grid');
    if(!grid) return;
    if(visibleJumbos.length===0){
      if(mySeq !== renderSeq) return; // มีรอบใหม่กว่าแซงเข้ามาแล้ว ทิ้งรอบนี้
      grid.innerHTML = jumbos.length===0
        ? '<div style="color:var(--ink-soft);font-size:13.5px;">ยังไม่มีจัมโบ้ในระบบ กด "+ เพิ่มจัมโบ้ใหม่" เพื่อเริ่มต้น</div>'
        : `<div style="color:var(--ink-soft);font-size:13.5px;">ไม่มีจัมโบ้ชนิด "${typeFilter}" ในระบบ</div>`;
      return;
    }

    // เตรียม QR และเนื้อหาการ์ดทั้งหมดให้เสร็จก่อน โดยยังไม่แตะ DOM ระหว่างรอ
    const cards = [];
    for(const j of visibleJumbos){
      if(mySeq !== renderSeq) return; // มีรอบใหม่กว่าแซงเข้ามาระหว่างเตรียมข้อมูล ทิ้งรอบนี้ทันที
      const log = usage[j.id] || [];
      const used = log.length;
      const maxUses = getMaxUses(j.type);
      const pct = Math.min(100, Math.round(used/maxUses*100));
      const qrUrl = await makeQrDataUrl(j.id, 90);
      let statusClass='ok', statusText='ใช้งานปกติ', meterClass='';
      if(j.status==='damaged'){ statusClass='full'; statusText='ชำรุด'; meterClass='full'; }
      else if(used>=maxUses){ statusClass='full'; statusText='ครบกำหนดการใช้งาน'; meterClass='full'; }
      else if(used>=maxUses-3){ statusClass='warn'; statusText='ใกล้ครบกำหนด'; meterClass='warn'; }

      const card = document.createElement('div');
      card.className='tag-card';
      card.innerHTML = `
        <div class="holes"><span class="hole"></span><span class="hole"></span></div>
        <div class="jno">Jumbo No. ${j.jno}</div>
        <div class="code">${TYPE_ABBR[j.type] || '?'}</div>
        <div class="name">${j.type}</div>
        <div class="qr-thumb"><img src="${qrUrl}" alt="QR ${j.id}"></div>
        <div class="meter-row">
          <div class="meter-label"><span>ใช้งานแล้ว</span><span>${used}/${maxUses}</span></div>
          <div class="meter ${meterClass}"><span style="width:${pct}%"></span></div>
        </div>
        <span class="status-pill status-${statusClass}">${statusText}</span>
      `;
      card.addEventListener('click', ()=>{ currentJumbo=j.id; renderDetail(j.id); });
      cards.push(card);
    }

    if(mySeq !== renderSeq) return; // มีรอบใหม่กว่าเสร็จก่อน ไม่ต้องวาดรอบนี้ทับ
    grid.innerHTML = '';
    cards.forEach(c=> grid.appendChild(c));
  };

  const refresh = async ()=>{
    try{
      const all = await fetchAll();
      latestJumbos = all.jumbos.sort((a,b)=> a.type===b.type ? a.jno-b.jno : a.type.localeCompare(b.type));
      latestUsage = all.usage;
      redraw();
    }catch(err){ toast('ดึงข้อมูลไม่สำเร็จ: ' + err.message); }
  };
  await refresh();
  const timer = setInterval(refresh, POLL_MS);
  activeUnsubs.push(()=> clearInterval(timer));
}

/* ---------------- Detail view (realtime usage log) ---------------- */
async function renderDetail(jumboId){
  clearListeners();
  let all;
  try{ all = await fetchAll(); }catch(err){ toast('ดึงข้อมูลไม่สำเร็จ: ' + err.message); goTo('list'); return; }
  const j = all.jumbos.find(x=>x.id===jumboId);
  if(!j){ toast('ไม่พบจัมโบ้นี้ในระบบ'); goTo('list'); return; }

  const panel = document.getElementById('panel');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  panel.innerHTML = `<button class="backlink" id="backBtn">‹ กลับไปรายการจัมโบ้</button>
  <div id="detailBody">กำลังโหลด...</div>`;
  document.getElementById('backBtn').addEventListener('click', ()=>{ currentJumbo=null; goTo('list'); });

  const qrUrl = await makeQrDataUrl(j.id, 220);
  let showFull = false;

  const redraw = (log)=>{
    // ผู้ใช้กำลังกรอกฟอร์มบันทึกการใช้งานอยู่ -> ข้ามการวาดหน้าจอทับรอบนี้ ไม่รบกวนการพิมพ์
    const active = document.activeElement;
    if(active && active.closest && active.closest('#entryForm')) return;

    const used = log.length;
    const maxUses = getMaxUses(j.type);
    const remaining = Math.max(0, maxUses - used);
    const isDamaged = j.status === 'damaged';
    const limitReached = used >= maxUses;

    let statusClass='ok', statusText=`เหลือใช้งานได้อีก ${remaining} ครั้ง (ใช้ไปแล้ว ${used}/${maxUses})`;
    if(isDamaged){ statusClass='bad'; statusText='ชำรุด — ใช้งานไม่ได้แล้ว'; }
    else if(limitReached){ statusClass='bad'; statusText='ครบกำหนดการใช้งานแล้ว'; }
    else if(remaining<=3){ statusClass='warn'; }

    let rows = '';
    for(let i=0;i<maxUses;i++){
      const e = log[i];
      rows += `<tr>
        <td class="rownum">${i+1}</td>
        <td>${e?e.date:'<span class="dash">—</span>'}</td>
        <td>${e? (e.clean?'<span class="tick">✓</span>':'<span class="dash">—</span>') : '<span class="dash">—</span>'}</td>
        <td>${e? (e.complete?'<span class="tick">✓</span>':'<span class="dash">—</span>') : '<span class="dash">—</span>'}</td>
        <td>${e?e.recorder:'<span class="dash">—</span>'}</td>
        <td>${e?e.inspector:'<span class="dash">—</span>'}</td>
        <td class="note">${e&&e.note?e.note:''}</td>
      </tr>`;
    }

    const body = document.getElementById('detailBody');
    if(!body) return;
    body.innerHTML = `
      <div class="quick-card">
        <div class="jtitle">Jumbo No. ${j.jno} &nbsp;·&nbsp; ${j.type}</div>
        <div class="jtype">${TYPE_ABBR[j.type] || '?'}</div>
        <div class="quick-status ${statusClass}">${statusText}</div>
        <div class="quick-actions">
          <button class="quick-btn use" id="btnUse" ${(isDamaged||limitReached)?'disabled':''}>✅ ใช้งาน</button>
          <button class="quick-btn damaged" id="btnDamaged" ${isDamaged?'disabled':''}>⚠️ ชำรุด</button>
        </div>
        <button class="toggle-details" id="toggleDetails">${showFull ? 'ซ่อนรายละเอียด ▴' : 'ดูรายละเอียด/ประวัติทั้งหมด ▾'}</button>
      </div>

      <div id="fullDetails" style="display:${showFull?'block':'none'};margin-top:18px;">
        <div class="detail-head">
          <div class="detail-qr"><img src="${qrUrl}" width="120" height="120" alt="QR ${j.id}"></div>
          <div class="detail-info">
            <div class="jno">Jumbo No. ${j.jno} &nbsp;·&nbsp; รหัส ${j.id}</div>
            <div class="code">${TYPE_ABBR[j.type] || '?'}</div>
            <div class="name">ชนิดข้าว: ${j.type}</div>
            <div class="detail-actions">
              <button class="btn small" id="dlQr">ดาวน์โหลด QR</button>
              <button class="btn small ghost" id="printLabel">พิมพ์ใบปะหน้า Summary</button>
              <button class="btn small ghost" id="deleteJumbo" style="border-color:var(--red);color:var(--red);">ลบจัมโบ้นี้</button>
            </div>
          </div>
        </div>

        <table class="ledger">
          <thead><tr>
            <th style="width:30px">ครั้งที่</th>
            <th>วันที่ใช้งาน</th>
            <th>ความสะอาด</th>
            <th>ความสมบูรณ์<br>ของจัมโบ้</th>
            <th>ผู้บันทึก</th>
            <th>ผู้ตรวจสอบ</th>
            <th>หมายเหตุ</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;

    document.getElementById('btnUse').addEventListener('click', async ()=>{
      document.getElementById('btnUse').disabled = true;
      document.getElementById('btnDamaged').disabled = true;
      const entry = {
        date: new Date().toISOString().slice(0,10),
        clean: true,
        complete: true,
        recorder: currentUser ? currentUser.name : '',
        inspector: '',
        note: '',
        ts: Date.now()
      };
      try{
        const ok2 = await addLogEntry(j.id, entry, getMaxUses(j.type));
        if(!ok2){ toast('จัมโบ้นี้ครบกำหนดการใช้งานแล้ว หรือถูกตีเป็นชำรุดไปแล้ว'); return; }
        toast(`บันทึกการใช้งานเรียบร้อย — กลับไปสแกนใบถัดไป`);
        setTimeout(()=>{ currentJumbo=null; goTo('scan'); }, 900);
      }catch(err){ toast('บันทึกไม่สำเร็จ: ' + err.message); }
    });

    document.getElementById('btnDamaged').addEventListener('click', async ()=>{
      const ok = confirm(`ยืนยันตีเป็นชำรุด Jumbo No.${j.jno} (${j.type})? จัมโบ้ใบนี้จะใช้งานต่อไม่ได้อีก`);
      if(!ok) return;
      document.getElementById('btnUse').disabled = true;
      document.getElementById('btnDamaged').disabled = true;
      try{
        await markDamaged(j.id, currentUser ? currentUser.name : '');
        toast(`ตี Jumbo No.${j.jno} เป็นชำรุดเรียบร้อย — กลับไปสแกนใบถัดไป`);
        setTimeout(()=>{ currentJumbo=null; goTo('scan'); }, 900);
      }catch(err){ toast('บันทึกไม่สำเร็จ: ' + err.message); }
    });

    document.getElementById('toggleDetails').addEventListener('click', ()=>{
      showFull = !showFull;
      redraw(log);
    });

    if(showFull){
      document.getElementById('dlQr').addEventListener('click', ()=>{
        const a = document.createElement('a');
        a.href = qrUrl; a.download = `QR-${j.id}.png`; a.click();
      });
      document.getElementById('printLabel').addEventListener('click', ()=> printLabel(j, log, qrUrl));
      document.getElementById('deleteJumbo').addEventListener('click', async ()=>{
        const ok = confirm(`ยืนยันลบ Jumbo No.${j.jno} (${j.type}) ออกจากระบบ? ประวัติการใช้งานทั้งหมดของจัมโบ้นี้จะถูกลบด้วย`);
        if(!ok) return;
        try{
          await deleteJumbo(j.id);
          toast(`ลบ Jumbo No.${j.jno} เรียบร้อย`);
          currentJumbo = null;
          goTo('list');
        }catch(err){ toast('ลบไม่สำเร็จ: ' + err.message); }
      });
    }
  };

  redraw(all.usage[jumboId] || []);
  const timer = setInterval(async ()=>{
    try{
      const fresh = await fetchAll();
      redraw(fresh.usage[jumboId] || []);
    }catch(err){ /* silent on background poll error */ }
  }, POLL_MS);
  activeUnsubs.push(()=> clearInterval(timer));
}

/* ---------------- Print label ---------------- */
function printLabel(j, log, qrUrl){
  const used = log.length;
  const maxUses = getMaxUses(j.type);
  let rows='';
  for(let i=0;i<maxUses;i++){
    const e = log[i];
    rows += `<tr>
      <td>${i+1}</td>
      <td>${e?e.date:''}</td>
      <td>${e&&e.clean?'✓':''}</td>
      <td>${e&&e.complete?'✓':''}</td>
      <td>${e?e.recorder:''}</td>
      <td>${e?e.inspector:''}</td>
      <td>${e&&e.note?e.note:''}</td>
    </tr>`;
  }
  document.getElementById('printArea').innerHTML = `
    <div style="font-family:'Noto Sans Thai',sans-serif;max-width:480px;margin:20px auto;border:1px solid #999;padding:14px;">
      <h2 style="text-align:center;font-size:16px;margin:0 0 6px;">ป้ายระบุและควบคุมการใช้จัมโบ้</h2>
      <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid #999;border-bottom:1px solid #999;padding:8px 0;margin-bottom:8px;">
        <div style="font-size:13px;">
          <div><strong>Jumbo No.:</strong> No.${j.jno}</div>
          <div><strong>ชนิดข้าว:</strong> ${j.type}</div>
          <div><strong>ใช้งานแล้ว:</strong> ${used}/${maxUses} ครั้ง</div>
        </div>
        <img src="${qrUrl}" width="90" height="90">
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:10.5px;">
        <thead><tr>
          <th style="border:1px solid #999;padding:3px;">ครั้งที่</th>
          <th style="border:1px solid #999;padding:3px;">วันที่ใช้งาน</th>
          <th style="border:1px solid #999;padding:3px;">สะอาด</th>
          <th style="border:1px solid #999;padding:3px;">สมบูรณ์</th>
          <th style="border:1px solid #999;padding:3px;">ผู้บันทึก</th>
          <th style="border:1px solid #999;padding:3px;">ผู้ตรวจสอบ</th>
          <th style="border:1px solid #999;padding:3px;">หมายเหตุ</th>
        </tr></thead>
        <tbody>${rows.replace(/<td>/g,'<td style="border:1px solid #999;padding:3px;text-align:center;">')}</tbody>
      </table>
    </div>`;
  window.print();
}

/* ---------------- Scan view ---------------- */
let scanStream = null;
let scanRAF = null;

async function renderScan(){
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <div class="section-title"><strong>สแกน QR จัมโบ้</strong></div>
    <div class="scan-wrap">
      <div class="viewfinder">
        <video id="scanVideo" playsinline muted></video>
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
      </div>
      <div class="scan-msg" id="scanMsg">กำลังขอสิทธิ์เข้าถึงกล้อง...</div>
      <div class="manual-scan">
        <label>หรือเลือกจัมโบ้ด้วยตนเอง</label>
        <select id="manualSelect" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:3px;font-family:'Noto Sans Thai';">
          <option value="">— เลือกจัมโบ้ —</option>
        </select>
        <button class="btn small" id="manualGo" style="margin-top:10px;">ไปที่จัมโบ้นี้</button>
      </div>
    </div>
  `;
  jumbosCache = await fetchJumbosOnce();
  const select = document.getElementById('manualSelect');
  select.innerHTML = '<option value="">— เลือกจัมโบ้ —</option>' +
    jumbosCache.map(j=>`<option value="${j.id}">Jumbo No.${j.jno} — ${j.type}</option>`).join('');

  document.getElementById('manualGo').addEventListener('click', ()=>{
    const val = document.getElementById('manualSelect').value;
    if(val){ currentJumbo=val; renderDetail(val); }
  });

  // รีเฟรชรายชื่อจัมโบ้เป็นระยะระหว่างอยู่หน้าสแกน เผื่อเพิ่งเพิ่มจัมโบ้ใหม่/พิมพ์ QR ใหม่มาสแกนทันที
  const refreshTimer = setInterval(async ()=>{
    try{
      const fresh = await fetchJumbosOnce();
      jumbosCache = fresh;
      const sel = document.getElementById('manualSelect');
      if(sel){
        const keep = sel.value;
        sel.innerHTML = '<option value="">— เลือกจัมโบ้ —</option>' +
          fresh.map(j=>`<option value="${j.id}">Jumbo No.${j.jno} — ${j.type}</option>`).join('');
        sel.value = keep;
      }
    }catch(e){ /* silent */ }
  }, POLL_MS);
  activeUnsubs.push(()=> clearInterval(refreshTimer));

  startScanner();
}

async function startScanner(){
  const video = document.getElementById('scanVideo');
  const msg = document.getElementById('scanMsg');

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    msg.textContent = 'เบราว์เซอร์นี้ไม่รองรับการเข้าถึงกล้อง (มักเกิดถ้าเปิดลิงก์จากแอป LINE/Facebook/Messenger) กรุณากดเปิดในเบราว์เซอร์ เช่น Chrome หรือ Safari แล้วลองใหม่ หรือเลือกจัมโบ้ด้วยตนเองด้านล่างแทน';
    return;
  }

  try{
    // ลองกล้องหลังก่อน (ideal ไม่ใช่ exact เพื่อไม่ให้ error ถ้าอุปกรณ์ไม่รองรับ) ถ้าไม่ได้ค่อย fallback เป็นกล้องอะไรก็ได้
    try{
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
    }catch(e1){
      scanStream = await navigator.mediaDevices.getUserMedia({ video: true });
    }
    video.srcObject = scanStream;
    await video.play();
    msg.textContent = 'เล็งกล้องไปที่ QR Code บนป้ายจัมโบ้ (ให้ QR อยู่กลางกรอบ ไม่เอียง ไม่ไกลเกินไป)';

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const MAX_SIDE = 640; // ลดขนาดเฟรมก่อนสแกน ให้ jsQR ประมวลผลเร็วขึ้นมาก แทนที่จะใช้ความละเอียดกล้องเต็มๆ ซึ่งทำให้อืดและจับ QR ไม่ทัน
    let lastMismatch = 0;
    let noSignalWarned = false;
    const scanStartedAt = Date.now();

    const tick = ()=>{
      if(!scanStream) return; // ถูกหยุดสแกนไปแล้ว
      if(video.readyState===video.HAVE_ENOUGH_DATA && video.videoWidth){
        const scale = Math.min(1, MAX_SIDE / Math.max(video.videoWidth, video.videoHeight));
        canvas.width = Math.round(video.videoWidth * scale);
        canvas.height = Math.round(video.videoHeight * scale);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
        if(code && code.data){
          const scanned = code.data.trim();
          const found = jumbosCache.find(j=>j.id===scanned);
          if(found){
            stopScanner();
            toast(`พบ Jumbo No.${found.jno} — ${found.type}`);
            currentJumbo = found.id;
            renderDetail(found.id);
            return;
          }
          // สแกนได้ QR แต่ข้อมูลไม่ตรงกับจัมโบ้ใดในระบบตอนนี้ — แจ้งให้เห็นชัดๆ แทนการเงียบไปเฉยๆ
          // (สาเหตุที่พบบ่อย: เป็น QR เก่าที่พิมพ์ไว้ก่อนเปลี่ยนระบบหลังบ้าน หรือจัมโบ้ถูกลบไปแล้ว)
          const now = Date.now();
          if(now - lastMismatch > 1500){
            lastMismatch = now;
            msg.innerHTML = `พบ QR แล้ว แต่รหัส <b>"${scanned}"</b> ไม่ตรงกับจัมโบ้ใดในระบบตอนนี้ — อาจเป็น QR เก่าจากระบบก่อนหน้า หรือจัมโบ้ถูกลบไปแล้ว<br><span style="color:var(--ink-soft);font-weight:400;">กำลังสแกนต่อ... ลองเล็งไปที่ QR ใบอื่น หรือเลือกจัมโบ้ด้วยตนเองด้านล่าง</span>`;
          }
        } else if(!noSignalWarned && Date.now() - scanStartedAt > 6000){
          // ผ่านไป 6 วิ ยังไม่เคยอ่านอะไรได้เลยแม้แต่ครั้งเดียว — น่าจะเป็นปัญหากล้องเอง ไม่ใช่ข้อมูลไม่ตรง
          noSignalWarned = true;
          msg.innerHTML = `ยังไม่พบ QR เลยในกล้อง — ลองเช็ค: แสงสว่างเพียงพอไหม / ป้าย QR เปื้อน-ยับ-เอียงไหม / ระยะห่างเหมาะสมไหม (ไม่ใกล้-ไกลเกินไป) หรือลองสลับกล้องหน้า-หลังโดยออกจากหน้านี้แล้วเข้าใหม่`;
        }
      }
      scanRAF = requestAnimationFrame(tick);
    };
    scanRAF = requestAnimationFrame(tick);
  }catch(err){
    let hint = '';
    if(err && err.name === 'NotAllowedError') hint = 'สิทธิ์เข้าถึงกล้องถูกปฏิเสธ — ไปที่การตั้งค่าเว็บไซต์ของเบราว์เซอร์แล้วอนุญาตกล้องสำหรับเว็บนี้';
    else if(err && err.name === 'NotFoundError') hint = 'ไม่พบกล้องในอุปกรณ์นี้';
    else if(err && err.name === 'NotReadableError') hint = 'กล้องถูกแอปอื่นใช้งานอยู่ ลองปิดแอปกล้อง/แอปอื่นที่ใช้กล้องอยู่แล้วลองใหม่';
    else hint = 'ถ้าเปิดลิงก์จากแอป LINE/Facebook/Messenger ให้กดเปิดในเบราว์เซอร์ เช่น Chrome หรือ Safari แทน';
    msg.textContent = `ไม่สามารถเข้าถึงกล้องได้ (${err && err.name ? err.name : err}) — ${hint} หรือเลือกจัมโบ้ด้วยตนเองด้านล่าง`;
  }
}

function stopScanner(){
  if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF=null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
}

/* ---------------- Export view ---------------- */
async function renderExport(){
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <div class="section-title"><strong>ส่งออกข้อมูลเป็น Excel</strong></div>
    <div class="export-box">
      <p id="exportIntro">กำลังโหลดข้อมูล...</p>
      <button class="btn" id="exportBtn">ดาวน์โหลดไฟล์ Excel</button>
      <table class="summary-table" id="summaryPreview"><tr><td>กำลังโหลดข้อมูล...</td></tr></table>
    </div>
  `;
  let jumbos = [], logs = {};
  try{
    const all = await fetchAll();
    jumbos = all.jumbos; logs = all.usage;
  }catch(err){ toast('ดึงข้อมูลไม่สำเร็จ: ' + err.message); }

  document.getElementById('exportIntro').innerHTML =
    `ส่งออกข้อมูลการใช้งานของจัมโบ้ทั้งหมด ${jumbos.length} รายการ เป็นไฟล์ Excel (.xlsx) ประกอบด้วย 2 ชีต:
    <br>1) สรุปภาพรวม — จำนวนครั้งที่ใช้และสถานะของแต่ละจัมโบ้
    <br>2) บันทึกการใช้งาน — รายละเอียดทุกครั้งที่บันทึกของทุกจัมโบ้`;
  const preview = document.getElementById('summaryPreview');
  preview.innerHTML = `<tr><th>Jumbo No.</th><th>ชนิดข้าว</th><th>ใช้งานแล้ว</th><th>สถานะ</th></tr>` +
    jumbos.map(j=>{
      const used = (logs[j.id]||[]).length;
      const maxUses = getMaxUses(j.type);
      const status = j.status==='damaged' ? 'ชำรุด' : (used>=maxUses ? 'ครบกำหนด' : (used>=maxUses-3 ? 'ใกล้ครบกำหนด' : 'ปกติ'));
      return `<tr><td>${j.jno}</td><td>${j.type}</td><td>${used}/${maxUses}</td><td>${status}</td></tr>`;
    }).join('');

  document.getElementById('exportBtn').addEventListener('click', ()=> exportExcel(jumbos, logs));
}

function exportExcel(jumbos, logs){
  const summaryRows = jumbos.map(j=>{
    const used = (logs[j.id]||[]).length;
    const maxUses = getMaxUses(j.type);
    const status = j.status==='damaged' ? 'ชำรุด' : (used>=maxUses ? 'ครบกำหนดการใช้งาน' : (used>=maxUses-3 ? 'ใกล้ครบกำหนด' : 'ใช้งานปกติ'));
    return {
      'Jumbo No.': j.jno,
      'รหัสจัมโบ้': j.id,
      'ชนิดข้าว': j.type,
      'จำนวนครั้งที่ใช้': used,
      'จำกัดสูงสุด': maxUses,
      'คงเหลือ': Math.max(0, maxUses-used),
      'สถานะ': status
    };
  });

  const detailRows = [];
  jumbos.forEach(j=>{
    const log = logs[j.id]||[];
    if(log.length===0){
      detailRows.push({'Jumbo No.':j.jno,'รหัสจัมโบ้':j.id,'ชนิดข้าว':j.type,'ครั้งที่':'','วันที่ใช้งาน':'','ความสะอาด':'','ความสมบูรณ์':'','ผู้บันทึก':'','ผู้ตรวจสอบ':'','หมายเหตุ':''});
      return;
    }
    log.forEach((e,i)=>{
      detailRows.push({
        'Jumbo No.': j.jno,
        'รหัสจัมโบ้': j.id,
        'ชนิดข้าว': j.type,
        'ครั้งที่': i+1,
        'วันที่ใช้งาน': e.date,
        'ความสะอาด': e.clean?'✓':'',
        'ความสมบูรณ์': e.complete?'✓':'',
        'ผู้บันทึก': e.recorder,
        'ผู้ตรวจสอบ': e.inspector,
        'หมายเหตุ': e.note||''
      });
    });
  });

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(summaryRows);
  const ws2 = XLSX.utils.json_to_sheet(detailRows);
  XLSX.utils.book_append_sheet(wb, ws1, 'สรุปจัมโบ้');
  XLSX.utils.book_append_sheet(wb, ws2, 'บันทึกการใช้งาน');
  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `jumbo-usage-log-${dateStr}.xlsx`);
  toast('ดาวน์โหลดไฟล์ Excel เรียบร้อย');
}
